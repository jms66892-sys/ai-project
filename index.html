<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 먹을 저녁 메뉴 추천</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>오늘 뭐 먹지?</h1>
    <p class="subtitle">결정 장애를 위한 저녁 메뉴 랜덤 추천기</p>
    
    <div class="result-container">
      <div id="food-emoji" class="emoji">🍽️</div>
      <div id="food-name" class="food-name">버튼을 눌러보세요!</div>
    </div>

    <button id="recommend-btn">저녁 메뉴 추천</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
